<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Utilisateurs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; background-color: #f8f9fa; }
        .container { max-width: 600px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .user-list-item { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div class="container">
    <h1 class="text-center mb-4">Gestion des Utilisateurs</h1>

    <section class="mb-5">
        <h3>Ajouter un utilisateur</h3>
        <form id="userForm" class="row g-3">
            <div class="col-md-6">
                <label for="firstName" class="form-label">Prénom</label>
                <input type="text" class="form-control" id="firstName" placeholder="Jean" required>
            </div>
            <div class="col-md-6">
                <label for="lastName" class="form-label">Nom</label>
                <input type="text" class="form-control" id="lastName" placeholder="Dupont" required>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary w-100">Ajouter</button>
            </div>
        </form>
    </section>

    <hr>

    <section>
        <h3>Liste des utilisateurs</h3>
        <ul id="userList" class="list-group">
            <li class="list-group-item text-muted">Aucun utilisateur pour le moment...</li>
        </ul>
    </section>
</div>

<script src="script.js"></script>
</body>
</html>
